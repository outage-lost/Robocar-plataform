<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>RoboCar Cámara</title>
  <link rel="stylesheet" href="/camera/styles.css">
  <script src="/socket.io/socket.io.js"></script>
</head>

<body>

  <!-- ── Login ── -->
  <section id="loginScreen" class="screen screen-active">
    <div class="auth-card">
      <p class="eyebrow">RoboCar</p>
      <h1>Cámara</h1>
      <p class="auth-copy">
        Autentica con <strong>TOKEN_CAMERA</strong> para transmitir video al panel.
      </p>
      <form id="loginForm" class="auth-form">
        <label for="tokenInput">TOKEN_CAMERA</label>
        <input id="tokenInput" type="password" placeholder="Ingresa el token" autocomplete="off" required>
        <button type="submit">Conectar</button>
        <p id="loginError" class="form-error"></p>
      </form>
    </div>
  </section>

  <!-- ── Camera app ── -->
  <main id="cameraApp" class="camera-app">

    <header class="status-bar">
      <div class="status-pill">
        <span id="socketStatus" class="status-dot status-offline"></span>
        <span>Conexión</span>
      </div>
      <p id="infoText">Listo</p>
    </header>

    <video id="cameraPreview" class="camera-preview" autoplay playsinline muted></video>
    <audio id="remoteAdminAudio" autoplay playsinline></audio>

    <footer class="controls-bar">

      <button id="btnFlip" class="control-btn" type="button">
        <span class="ctrl-icon">⟳</span>
        <span class="btn-label">Girar</span>
      </button>

      <button id="btnStream" class="control-btn control-btn-stream" type="button">
        <span class="ctrl-icon">●</span>
        <span class="btn-label">Transmitir</span>
      </button>

      <button id="btnFlash" class="control-btn" type="button">
        <span class="ctrl-icon">✦</span>
        <span class="btn-label">Flash</span>
      </button>

      <button id="btnMic" class="control-btn" type="button">
        <span class="ctrl-icon">◉</span>
        <span class="btn-label">Micrófono encendido</span>
      </button>

    </footer>

  </main>

  <script src="/camera/camera.js"></script>
</body>

</html>
